name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build frontend
        # go:embed frontend/dist embeds whatever exists on disk; without an
        # npm build the CI binary ships only index.html (blank web UI).
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          CI: true
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test
        run: CGO_ENABLED=0 go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -ldflags "-X aipmc/u.BuildVersion=$(git rev-parse --short HEAD)" ./...
